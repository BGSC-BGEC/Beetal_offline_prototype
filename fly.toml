# Deploy: fly launch --no-deploy --copy-config --name <your-app-name>   (first time only)
#         fly deploy --ha=false
# Rooms are kept in memory, so this must stay a single, always-on machine.
app = "betaal-proto"
primary_region = "bom"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "5s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
